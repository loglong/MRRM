apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mrrm-ingress
  namespace: mrrm
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  tls:
    - hosts:
        - api.mrrm.example.com
        - app.mrrm.example.com
      secretName: mrrm-tls-secret
  rules:
    - host: api.mrrm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
    - host: app.mrrm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: mrrm-tls-secret
  namespace: mrrm
type: kubernetes.io/tls
stringData:
  # NOTE: Replace with actual TLS certificate in production
  # Use cert-manager or external secrets manager for production
  tls.crt: "PLACEHOLDER_CERT"
  tls.key: "PLACEHOLDER_KEY"
