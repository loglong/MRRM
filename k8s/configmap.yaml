apiVersion: v1
kind: ConfigMap
metadata:
  name: mrrm-config
  namespace: mrrm
data:
  NODE_ENV: "production"
  PORT: "3000"
  DATABASE_URL: "postgresql://mrrm:${POSTGRES_PASSWORD}@postgres:5432/mrrm?schema=public"
  REDIS_URL: "redis://redis:6379/0"
  RABBITMQ_URL: "amqp://mrrm:${RABBITMQ_PASSWORD}@rabbitmq:5672"
  CORS_ORIGIN: "https://app.mrrm.example.com"
  LOG_LEVEL: "info"
