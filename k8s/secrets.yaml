apiVersion: v1
kind: Secret
metadata:
  name: mrrm-secrets
  namespace: mrrm
type: Opaque
stringData:
  # Database credentials
  postgres-password: "REPLACE_WITH_SECURE_PASSWORD"
  redis-password: "REPLACE_WITH_SECURE_PASSWORD"
  rabbitmq-password: "REPLACE_WITH_SECURE_PASSWORD"

  # JWT configuration
  jwt-secret: "REPLACE_WITH_SECURE_JWT_SECRET"

  # SSO configuration (Authing)
  authing-app-id: "REPLACE_WITH_AUTHING_APP_ID"
  authing-app-secret: "REPLACE_WITH_AUTHING_APP_SECRET"
  authing-callback-url: "https://api.mrrm.example.com/api/v1/auth/sso/callback"
